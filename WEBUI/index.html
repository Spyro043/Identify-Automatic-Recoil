<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>弹道控制台</title>
<style>
[hidden]{display:none!important}
button{white-space:nowrap}header .row{flex:none}
:root{color-scheme:dark;font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif;background:#0a101b;color:#e8eef7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 15px;background:#23354e;color:#edf4ff}button:hover{background:#304866}button.primary{background:#3a82ed;color:white}button.primary:hover{background:#5395f8}button.danger{background:#733d4c}input,select,textarea{width:100%;background:#0f1a2a;border:1px solid #31415a;border-radius:8px;color:#edf4ff;padding:9px 10px;outline:none}input:focus,select:focus,textarea:focus{border-color:#62a6ff}input[type=checkbox]{width:auto;accent-color:#4d91f5}label{display:block;color:#a8b9cf;font-size:12px}label>input,label>select,label>textarea{display:block;margin-top:5px}header{height:69px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #243248;background:#101b2b}header strong{font-size:20px;letter-spacing:1px}header small{display:block;color:#88a0bd;letter-spacing:0}main{max-width:1600px;margin:auto;padding:24px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}.card{background:#142136;border:1px solid #2a3b54;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 12px 35px #050b1530}h2{font-size:16px;margin:0 0 15px}h3{font-size:13px;color:#80a5d6;margin:20px 0 11px;text-transform:uppercase;letter-spacing:.08em}.sub{color:#8195af;font-size:12px}.row{display:flex;align-items:end;gap:9px}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.status{display:flex;align-items:center;gap:9px;color:#b5cae0;padding:10px 0}.dot{width:9px;height:9px;border-radius:50%;background:#ffba64;box-shadow:0 0 15px currentColor}.connected .dot{background:#57d5a6}.running .dot{background:#5ca6ff}.muted{color:#879cb4}.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:15px}.templates{max-height:620px;overflow:auto;border:1px solid #2a3b54;border-radius:10px;background:#101b2c}.template{display:block;width:100%;text-align:left;border-radius:0;border-bottom:1px solid #22314a;background:transparent;padding:11px 14px}.template:hover,.template.active{background:#253f62}.template small{display:block;color:#90a7c3}.pill{display:inline-block;background:#20406a;color:#89bcff;border-radius:999px;font-size:11px;padding:3px 8px;margin-left:6px}textarea{min-height:128px;font-family:Consolas,monospace}.log{height:138px;overflow:auto;background:#0b1524;border-radius:9px;padding:10px;font:12px/1.6 Consolas,monospace;color:#9bb1cc;white-space:pre-wrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1}.overlay{position:fixed;inset:0;background:#030813dc;display:grid;place-items:center;z-index:10;padding:20px}.dialog{width:min(620px,100%);background:#15253d;border:1px solid #365478;padding:30px;border-radius:18px;box-shadow:0 25px 80px #0009}.dialog h1{margin:0 0 8px;font-size:25px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.choice{text-align:left;padding:20px;min-height:110px;border:1px solid #375778;background:#1b324f}.choice strong{display:block;font-size:18px;margin-bottom:8px}.choice span{font-size:12px;color:#b8cae0}.notice{position:fixed;right:20px;bottom:20px;padding:13px 18px;border-radius:9px;background:#27715e;box-shadow:0 12px 35px #0006;z-index:30;max-width:440px}.notice.error{background:#8d3d4a}@media(max-width:950px){main{display:block}.split{grid-template-columns:1fr}.templates{max-height:240px}.grid.four{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div><strong>弹道控制台</strong><small>识别 · 轨迹 · 设备</small></div><div class="row"><span id="modeLabel" class="muted">未选择模式</span><button onclick="showMode()">切换模式</button><button class="danger" onclick="exitApp()">退出程序</button></div></header>
<main><aside>
<section class="card"><h2>运行状态</h2><div class="status" id="status"><i class="dot"></i><span>等待选择模式</span></div><div class="toolbar"><button class="primary" onclick="start(true)">启动识别</button><button onclick="start(false)">试运行</button><button onclick="api('/api/stop',{})">停止</button></div><p class="sub">右键瞄准并按住左键时执行当前识别轨迹。试运行不发送设备移动。</p></section>
<section class="card"><h2>输出设备</h2><div id="deviceFields"></div><div class="toolbar" style="margin-top:15px"><button class="primary" onclick="saveSettings().then(()=>api('/api/connect',{}))">连接设备</button><button onclick="api('/api/disconnect',{})">断开</button></div><h3>测试移动</h3><div class="row"><label>X<input id="testX" type="number" value="20" min="-100" max="100"></label><label>Y<input id="testY" type="number" value="0" min="-100" max="100"></label><button onclick="api('/api/test',{dx:+testX.value,dy:+testY.value})">移动并返回</button></div><p class="sub">请观察鼠标实际移动。命令已发送不代表驱动必然产生位移。</p></section>
<section class="card"><h2>运行日志</h2><div id="log" class="log"></div></section>
</aside><div>
<section class="card"><div class="row"><div><h2>模板库 <span id="count" class="pill">0</span></h2><div class="sub">每个模板独立保存力度、方向和分段调整</div></div><button onclick="importVector()">导入本机 Vector 模板</button></div><div class="split" style="margin-top:16px"><div><input id="search" placeholder="搜索名称或标识" oninput="renderList()"><div class="templates" id="templateList" style="margin-top:9px"></div><p class="sub">识别图片须与模板标识同名，放在 CONFIG 文件夹。</p></div><div><div class="row"><h2 id="editTitle">选择模板</h2><button onclick="newProfile()">新建模板</button></div><div id="editor"></div></div></div></section>
<section class="card"><div class="row"><h2>识别与全局设置</h2><button class="primary" onclick="saveSettings()">保存设置</button></div><div class="grid four" id="globalFields"></div><p class="sub">区域坐标对应屏幕左上 (X,Y) 与右下 (X,Y)。修改后重新启动识别生效。</p></section>
</div></main>
<div class="overlay" id="modeDialog"><div class="dialog"><h1>选择运行模式</h1><div class="muted">启动时选择输出方式。只有内核驱动模式会加载 DD DLL 并初始化驱动。</div><div class="choices"><button class="choice" onclick="chooseMode('driver')"><strong>内核驱动</strong><span>使用本机已授权的 DD 驱动 DLL</span></button><button class="choice" onclick="chooseMode('hardware')"><strong>硬件设备</strong><span>KMBOXNET / 马克盒子；不加载 DD 驱动</span></button></div></div></div>
<div id="toast" class="notice" hidden></div>
<script>
let state=null, selected=null, editing=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(message,error=false){let n=$('toast');n.textContent=message;n.classList.toggle('error',error);n.hidden=false;setTimeout(()=>n.hidden=true,4200)}
async function api(path,data){try{let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');state=j;render();if(path!='/api/state')notice('操作完成');return j}catch(e){notice(e.message,true);throw e}}
async function refresh(){try{let r=await fetch('/api/state');state=await r.json();render()}catch(e){notice('服务已退出',true)}}
function showMode(){$('modeDialog').hidden=false}
async function chooseMode(mode){if(state?.running){notice('请先停止识别',true);return}await api('/api/mode',{mode});$('modeDialog').hidden=true;editing=false;render();if(mode==='driver')api('/api/connect',{}).catch(()=>{})}
function field(id,label,type='text',value=''){return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}"></label>`}
function render(){if(!state)return;$('modeDialog').hidden=!!state.mode;$('modeLabel').textContent=state.mode==='driver'?'内核驱动 / DD':state.mode==='hardware'?'硬件设备 / '+state.settings.device:'未选择模式';$('status').className='status '+(state.running?'running':state.connected?'connected':'');$('status').querySelector('span').textContent=state.status;$('count').textContent=state.profiles.length;$('log').textContent=state.logs.join('\n');$('log').scrollTop=$('log').scrollHeight;renderDevice();renderList();if(!editing)renderEditor();renderGlobal()}
function renderDevice(){let s=state.settings,body='';if(state.mode==='hardware'){body=`<label>设备<select id="device" onchange="renderDeviceFields()"><option value="KMBOXNET">KMBOXNET</option><option value="MAKCU">马克盒子 MAKCU</option></select></label><div id="deviceExtra"></div>`}else if(state.mode==='driver'){body='<p class="sub">便携版使用 EXE 内置 DD 驱动。选择内核模式时自动初始化；连接失败可点击“连接设备”重试。</p>'}else body='<p class="muted">先选择运行模式</p>';if($('deviceFields').dataset.mode!==state.mode){$('deviceFields').innerHTML=body;$('deviceFields').dataset.mode=state.mode;if(state.mode==='hardware'){$('device').value=s.device;renderDeviceFields()}}}
function renderDeviceFields(){let d=$('device')?.value,s=state.settings;if(!d)return;$('deviceExtra').innerHTML=d==='KMBOXNET'?`<div class="grid">${field('ip','IP 地址','text',s.ip)}${field('port','端口','text',s.port)}</div>${field('uid','UID','text',s.uid)}`:`<div class="grid">${field('makcu_port','COM 串口','text',s.makcu_port)}<label>波特率<select id="makcu_baudrate"><option>115200</option><option>4000000</option></select></label></div>`;if(d==='MAKCU')$('makcu_baudrate').value=s.makcu_baudrate}
function renderGlobal(){if($('globalFields').children.length)return;let s=state.settings;for(let [id,label,type] of [['threshold','匹配阈值','number'],['scale','轨迹缩放','number'],['sensitivity','全局灵敏度','number'],['tick_ms','轨迹间隔 ms','number'],['region_left','左 X','number'],['region_top','上 Y','number'],['region_right','右 X','number'],['region_bottom','下 Y','number']])$('globalFields').insertAdjacentHTML('beforeend',field(id,label,type,s[id]))}
async function saveSettings(){let keys=['ip','port','uid','makcu_port','makcu_baudrate','dd_dll_path','threshold','scale','sensitivity','tick_ms','region_left','region_top','region_right','region_bottom','device'],out={};for(let k of keys)if($(k))out[k]=$(k).value;await api('/api/settings',out)}
function start(execute){saveSettings().then(()=>api('/api/start',{execute}))}
async function exitApp(){await api('/api/exit',{});document.body.innerHTML='<main><section class="card"><h2>程序已退出</h2><p>可以关闭这个浏览器标签页。</p></section></main>'}
function renderList(){if(!state)return;let q=$('search').value.trim().toLowerCase(),list=state.profiles.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.key||'').toLowerCase().includes(q));$('templateList').innerHTML=list.map(p=>`<button class="template ${p.key===selected?'active':''}" data-key="${esc(p.key)}"><b>${esc(p.name||p.key)}</b>${p.enabled===false?'<span class="pill">停用</span>':''}<small>${esc(p.key)} · ${esc(p.category||'其他')} · ${p.image_ready?'图片就绪':'缺少 BMP'}</small></button>`).join('')||'<p class="muted" style="padding:12px">没有模板。可导入本机 Vector 数据。</p>';$('templateList').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.key;editing=false;renderList();renderEditor()})}
function newProfile(){selected='';editing=false;renderEditor()}
function renderEditor(){let p=state.profiles.find(v=>v.key===selected)||{key:'',name:'',category:'AR',enabled:true,power:100,x_power:100,y_power:100,level:0,frequency:10,decline:0,duration:3,start_delay:0,initial_drop:0,adjustments:[]};$('editTitle').textContent=p.name||'新建模板';$('editor').innerHTML=`<div class="grid">${field('p_key','模板标识','text',p.key)}${field('p_name','显示名称','text',p.name)}${field('p_category','分类','text',p.category)}<label>启用识别<select id="p_enabled"><option value="true">启用</option><option value="false">停用</option></select></label></div><h3>力度与轨迹</h3><div class="grid four">${field('p_power','总力度 %','number',p.power??100)}${field('p_x_power','水平力度 %','number',p.x_power??100)}${field('p_y_power','垂直力度 %','number',p.y_power??100)}${field('p_level','脉冲力度 level','number',p.level??0)}${field('p_frequency','脉冲频率 / 秒','number',p.frequency??10)}${field('p_decline','连续下压 / 秒','number',p.decline??0)}${field('p_duration','持续秒数','number',p.duration??3)}${field('p_start_delay','启动延迟 秒','number',p.start_delay??0)}${field('p_initial_drop','前 0.15 秒附加下压','number',p.initial_drop??0)}</div><h3>分段调整</h3><p class="sub">JSON 数组：start_time、duration、direction、intensity、enabled。方向可用 left/right/up/down 及对角方向。</p><textarea id="p_adjustments"></textarea><div class="toolbar" style="margin-top:12px"><button class="primary" onclick="saveProfile()">保存模板</button><button onclick="newProfile()">清空编辑器</button></div><p class="sub">Vector 模板使用 level、frequency、decline 和分段参数；已有逐步轨迹 path 会保留。修改后重新启动识别生效。</p>`;$('p_enabled').value=String(p.enabled!==false);$('p_adjustments').value=JSON.stringify(p.adjustments||[],null,2)}
async function saveProfile(){try{let original=state.profiles.find(v=>v.key===selected)||{},p={...original};for(let k of ['key','name','category'])p[k]=$('p_'+k).value.trim();for(let k of ['power','x_power','y_power','level','frequency','decline','duration','start_delay','initial_drop'])p[k]=Number($('p_'+k).value);p.enabled=$('p_enabled').value==='true';p.adjustments=JSON.parse($('p_adjustments').value);await api('/api/profile',{profile:p});selected=p.key;editing=false;render()}catch(e){notice(e.message,true)}}
function importVector(){let path=prompt('Vector 2.1 文件夹路径（只读取本机文件）','C:\\Users\\lenovo\\Documents\\Vector2.1弹道版');if(path)api('/api/import',{path}).then(()=>{$('globalFields').innerHTML='';renderGlobal()})}
document.addEventListener('input',e=>{if(e.target.closest('#editor'))editing=true});refresh();setInterval(refresh,2000);
</script>
</body></html>
